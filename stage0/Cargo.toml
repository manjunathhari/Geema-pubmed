[package]
name = "stage0-runner"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "stage0-runner"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[workspace]
